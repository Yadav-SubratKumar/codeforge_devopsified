apiVersion: v1
kind: ConfigMap
metadata:
  name: codeforge-config
  labels:
    app.kubernetes.io/name: {{ .Values.appname }}
data:
  NODE_ENV: "production"
  PORT: "5000"
  LOG_LEVEL: "info"
  REDIS_URL: "redis://redis:6379"
  ALLOWED_ORIGINS: "*"
  DATABASE_URL: "postgresql://codeforge:CHANGE_ME_STRONG_PASSWORD@postgres:5432/codeforge_db"

